name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src
      - run: pytest -q

  ios-shim-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Generate minimal shim sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import il2cppapk2ios.shimgen as shimgen
          from il2cppapk2ios.elf import ProgramHeader
          from il2cppapk2ios.shimgen import (
              _direct_assembly,
              _trap_assembly,
              SPECIAL_C,
              OBJECTS_ASM,
              BUILD_SH,
              _elf_phdr_compat_source,
          )

          out = Path("shim-smoke")
          out.mkdir()
          (out / "direct.S").write_text(
              _direct_assembly(["malloc", "strlen"]),
              encoding="utf-8",
          )
          (out / "trap.S").write_text(
              _trap_assembly(["setjmp"]),
              encoding="utf-8",
          )
          (out / "objects.S").write_text(OBJECTS_ASM, encoding="utf-8")
          (out / "special.c").write_text(SPECIAL_C, encoding="utf-8")
          template = (
              Path(shimgen.__file__).with_name("templates")
              / "pthread_compat.c"
          )
          (out / "pthread_compat.c").write_text(
              template.read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          posix_template = (
              Path(shimgen.__file__).with_name("templates")
              / "posix_compat.c"
          )
          (out / "posix_compat.c").write_text(
              posix_template.read_text(encoding="utf-8"),
              encoding="utf-8",
          )

          class FakeElf:
              program_headers = [
                  ProgramHeader(1, 5, 0, 0, 0x1000, 0x1000, 0x1000),
                  ProgramHeader(0x6474E550, 4, 0x800, 0x800, 0x100, 0x100, 4),
              ]

          (out / "elf_phdr_compat.c").write_text(
              _elf_phdr_compat_source(FakeElf()),
              encoding="utf-8",
          )
          (out / "build.sh").write_text(BUILD_SH, encoding="utf-8")
          PY
      - name: Build iPhoneOS ARM64 shim
        run: sh shim-smoke/build.sh
      - name: Inspect Mach-O
        run: |
          file shim-smoke/build/libbionic_shim.dylib
          xcrun llvm-objdump --macho --private-headers shim-smoke/build/libbionic_shim.dylib


  phase4-macho-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Build synthetic Phase 4 dylib
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path
          from il2cppapk2ios.phase4 import Phase4Translator

          ns = runpy.run_path("tests/test_phase4.py")
          FakeElf = ns["FakeElf"]
          report = Phase4Translator(FakeElf()).translate("phase4-smoke.dylib")
          print(report)
          PY
      - name: Validate Mach-O exports and sections
        run: |
          file phase4-smoke.dylib
          xcrun llvm-objdump --macho --private-headers phase4-smoke.dylib
          xcrun llvm-objdump --macho --exports-trie phase4-smoke.dylib
          xcrun llvm-objdump --macho --section-headers phase4-smoke.dylib
