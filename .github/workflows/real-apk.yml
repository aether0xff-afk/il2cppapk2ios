name: real-apk-ios-bundle

on:
  workflow_dispatch:

jobs:
  build-real-bundle:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download hardcoded Squad Strike APK
        run: |
          set -euxo pipefail
          FILE_ID="1yCu8cEWuAG7J7NmTM-8pofG2M5phQ-up"
          python3 -m pip install --disable-pip-version-check gdown
          python3 -m gdown "$FILE_ID" -O target.apk
          ls -lh target.apk
          file target.apk
          python3 - <<'PY'
          import zipfile
          p = "target.apk"
          if not zipfile.is_zipfile(p):
              head = open(p, "rb").read(200)
              raise SystemExit(f"Drive did not return APK/ZIP: {head!r}")
          with zipfile.ZipFile(p) as z:
              assert "lib/arm64-v8a/libil2cpp.so" in z.namelist()
              assert any(n.endswith("global-metadata.dat") for n in z.namelist())
          print("Squad Strike APK validated")
          PY

      - name: Build real translated iOS bundle
        run: |
          sh scripts/build_real_ios_bundle.sh "$PWD/target.apk" "$PWD/work-real"

      - name: Package unsigned app
        run: |
          ditto -c -k --keepParent work-real/A2IHost.app A2IHost-unsigned.zip

      - name: Upload reports and unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: squad-strike-ios-probe
          if-no-files-found: error
          retention-days: 7
          path: |
            A2IHost-unsigned.zip
            work-real/phase4-report.json
            work-real/shim-report.json
            work-real/ported-bind.txt
